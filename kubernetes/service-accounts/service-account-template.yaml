# Cada servicio (P1-P6) tiene su propia ServiceAccount dedicada — nunca "default".
# El token no se automonta salvo que el pod lo necesite explícitamente (ADR-004:
# identidad de workload vía SPIFFE/SPIRE, no vía token de ServiceAccount estático).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: "{{SERVICE_NAME}}"
  namespace: "{{NAMESPACE}}"
automountServiceAccountToken: false
