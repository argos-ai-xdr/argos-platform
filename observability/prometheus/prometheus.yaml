# Skeleton de configuración de scrape. Prometheus/Grafana OSS (ADR-009); sin
# exportadores SaaS obligatorios.
global:
  scrape_interval: 15s
  external_labels:
    org: argos-ai-xdr

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector.argos-observability.svc:8889"]

  - job_name: kubernetes-pods
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"

rule_files:
  - "../alerts/*.yaml"
